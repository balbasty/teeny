# teeny documentation — MkDocs + Material (also consumable by Zensical, squidfunk's
# successor to Material for MkDocs: `pip install mkdocs-material` then `mkdocs serve`).
site_name: teeny
site_description: A teeny, header-only C++17 tensor library for host + CUDA
docs_dir: docs
repo_url: https://github.com/balbasty/teeny
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: { icon: material/weather-sunny, name: Light mode }
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
    - Tensors & ownership: tensors.md
    - Shapes & strides: shapes-strides.md
    - Indexing & slicing: indexing.md
    - Math & broadcasting: math.md
    - Views & structure: structure.md
    - Dispatch & the ndarray boundary: dispatch.md
    - Half precision: half.md
  - Tutorials:
    - CPU + CUDA kernels for DLPack → Python: tutorials/dlpack-python.md
  - API reference: reference.md
markdown_extensions:
  - admonition
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }
