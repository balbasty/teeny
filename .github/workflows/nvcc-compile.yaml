name: Compile with nvcc (device pass)

# Compile-only device build. nvcc compiles CUDA WITHOUT a GPU (only *running*
# kernels needs one), so this catches device-pass compile errors — `__CUDA_ARCH__`
# pitfalls, device-unsafe engine code — that the host-only g++/clang++ suite can
# never see. It does NOT run anything (that would need a GPU).

on:
  push:
    branches:
      - main
    paths:
      - include/**
      - tests/nvcc_smoke.cu
      - .github/workflows/nvcc-compile.yaml
  pull_request:
    paths:
      - include/**
      - tests/nvcc_smoke.cu
      - .github/workflows/nvcc-compile.yaml

permissions:
  contents: read

jobs:
  nvcc-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The vendored CCCL (v2.8.2) supports CUDA 11.1+, so we prove BOTH ends of the
      # supported range: 11.8 (the floor — the cu11 wheel toolkit, reaching old archs
      # / drivers) and 12.6 (a recent 12.x). Each CUDA pins its max host g++ (11.8 ->
      # g++<=11; 12.6 -> g++<=13), so the toolkit/host combo is fixed, not left to the
      # runner. See docs/cuda-compat.md.
      matrix:
        include:
          - cuda: '11.8.0'
            gxx: '11'
          - cuda: '12.6.1'
            gxx: '13'
    name: nvcc ${{ matrix.cuda }} (g++-${{ matrix.gxx }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # CCCL is a submodule pinned via SSH in .gitmodules; rewrite to HTTPS so the
      # runner can fetch it without an SSH key.
      - name: Fetch CCCL submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install host compiler (g++-${{ matrix.gxx }})
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-${{ matrix.gxx }}

      - name: Install CUDA toolkit (nvcc, no GPU)
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: ${{ matrix.cuda }}
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      - name: Show nvcc version
        run: nvcc --version

      # Compile the device smoke TU only (`--compile`, no link, no run). The
      # vendored CCCL headers are used so cuda::std::mdspan matches the host build.
      - name: Compile-only device build
        run: |
          nvcc -std=c++17 -ccbin g++-${{ matrix.gxx }} \
               -I include -I external/cccl/libcudacxx/include \
               --compile tests/nvcc_smoke.cu -o "$RUNNER_TEMP/nvcc_smoke.o"
          echo "nvcc device-pass compile succeeded (CUDA ${{ matrix.cuda }})"
