name: Compile with nvcc (device pass)

# Compile-only device build. nvcc compiles CUDA WITHOUT a GPU (only *running*
# kernels needs one), so this catches device-pass compile errors — `__CUDA_ARCH__`
# pitfalls, device-unsafe engine code — that the host-only g++/clang++ suite can
# never see. It does NOT run anything (that would need a GPU).

on:
  push:
    branches:
      - main
    paths:
      - include/**
      - tests/nvcc_smoke.cu
      - .github/workflows/nvcc-compile.yaml
  pull_request:

permissions:
  contents: read

jobs:
  nvcc-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # CCCL is a submodule pinned via SSH in .gitmodules; rewrite to HTTPS so the
      # runner can fetch it without an SSH key.
      - name: Fetch CCCL submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      # CUDA 12.6 pairs with a host g++ <= 13; install g++-13 and point nvcc at it
      # so the toolkit/host-compiler combo is pinned rather than left to the runner.
      - name: Install host compiler (g++-13)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-13

      - name: Install CUDA toolkit (nvcc, no GPU)
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.6.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      - name: Show nvcc version
        run: nvcc --version

      # Compile the device smoke TU only (`--compile`, no link, no run). The
      # vendored CCCL headers are used so cuda::std::mdspan matches the host build.
      - name: Compile-only device build
        run: |
          nvcc -std=c++17 -ccbin g++-13 \
               -I include -I external/cccl/libcudacxx/include \
               --compile tests/nvcc_smoke.cu -o "$RUNNER_TEMP/nvcc_smoke.o"
          echo "nvcc device-pass compile succeeded"
