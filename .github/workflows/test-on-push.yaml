name: Test on push

# Trigger: run the compiler matrix on pushes to main, and on PRs, that touch the
# library, tests, examples, build, or the workflows themselves. Docs-only changes
# (docs/**, *.md) match none of these paths, so they skip the test matrix entirely.

on:
  push:
    branches:
      - main
    paths:
      - include/**
      - tests/**
      - examples/**
      - external/**
      - Makefile
      - CMakeLists.txt
      - .github/workflows/test*.yaml
  pull_request:
    paths:
      - include/**
      - tests/**
      - examples/**
      - external/**
      - Makefile
      - CMakeLists.txt
      - .github/workflows/test*.yaml

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test-matrix.yaml
  # The same suite on the same two compilers, rebuilt with
  # -DTNY_NO_NEGATIVE_INDEX (`make negindex`). That is a real, documented build
  # flag, but it used to be covered only by "remember to try it locally" — so
  # five tests that silently assumed the negative-index wrap it removes drifted
  # in unnoticed and had to be spotted by hand ([#446]). Now a regression under
  # the flag fails CI like any other (#455).
  #
  # [#446]: https://github.com/balbasty/teeny/issues/446
  tests-negindex:
    uses: ./.github/workflows/test-matrix.yaml
    with:
      target: negindex
  tests-cmake:
    uses: ./.github/workflows/test-cmake-matrix.yaml
