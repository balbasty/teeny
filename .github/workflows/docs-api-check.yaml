name: Check autodoc page is up to date

# Trigger: docs/api/index.md is generated from the header doc-comments by
# docs/gen-api.sh (doxygen + moxygen) — see docs/gen-api.sh and CLAUDE.md's
# add-a-feature checklist item 6. Nothing forced the committed page to be
# regenerated when a header doc-comment changed, so it drifted silently
# (#429). This job regenerates it and fails the diff isn't empty, so a PR
# that changes a doc-comment can't merge without docs/api/index.md following.

on:
  push:
    branches:
      - main
    paths:
      - include/**
      - Doxyfile
      - docs/gen-api.sh
      - docs/api/index.md
      - .github/workflows/docs-api-check.yaml
  pull_request:
    paths:
      - include/**
      - Doxyfile
      - docs/gen-api.sh
      - docs/api/index.md
      - .github/workflows/docs-api-check.yaml

permissions:
  contents: read

jobs:
  autodoc-check:
    runs-on: ubuntu-latest
    # A hung apt step (interactive debconf prompt / dpkg-lock contention) would
    # otherwise sit until the 6h job cap; fail fast instead (mirrors docs.yaml).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Non-interactive + a bounded lock wait so a debconf prompt or a background
      # apt-daily lock can't hang the step indefinitely (mirrors docs.yaml).
      - name: Install doxygen
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=120 doxygen

      - name: Regenerate autodoc
        run: bash docs/gen-api.sh

      - name: Fail if docs/api/index.md is stale
        run: |
          if ! git diff --exit-code -- docs/api/index.md; then
            echo "::error::docs/api/index.md is out of date. Run 'bash docs/gen-api.sh' and commit the result."
            exit 1
          fi
