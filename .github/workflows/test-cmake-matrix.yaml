name: Run CMake+CTest matrix (macOS / Windows)

# Cross-platform build via the project's CMakeLists.txt: each tests/test_*.cpp
# is already a CTest target (TEENY_BUILD_TESTS, on by default for the top-level
# project). Covers macos-latest (AppleClang) and windows-latest (MSVC) — teeny
# claims that support (docs/cuda-compat.md) but only the Linux g++/clang++
# Makefile matrix (test-matrix.yaml) proved it before this workflow.
#
# Linux keeps the Makefile as the reference build (test-matrix.yaml); this
# workflow does not touch it. CMake's compile-features abstraction picks the
# right per-compiler C++17 flag (/std:c++17 on MSVC, -std=c++17 elsewhere), so
# no manual flag wrangling is needed here.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # windows-latest (MSVC) currently fails on a compiler-specific defect in
    # operator()'s overload set (#268) unrelated to this CI-infra change;
    # non-blocking until that's root-caused on a real MSVC toolchain.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      # The CCCL dependency is a git submodule pinned via SSH in .gitmodules;
      # rewrite to HTTPS so the runner can fetch it without an SSH key.
      - name: Fetch CCCL submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      # Examples are ON here too: they carry the same portability assertions the
      # tests do (#368 — examples/cholesky_solve.cpp's sizeof check missed the
      # #295 MSVC EBO guard precisely because nothing compiled it on MSVC).
      - name: Configure
        run: cmake -S . -B build -DTEENY_BUILD_TESTS=ON -DTEENY_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
