name: Build and deploy docs

# Reusable: build the Zensical site (docs/ + zensical.toml -> site/) and deploy
# it to GitHub Pages. Enable Pages for the repo with "Source: GitHub Actions".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung apt step (interactive debconf prompt / dpkg-lock contention) would
    # otherwise sit until the 6h job cap; fail fast instead.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Zensical
        run: pip install -r docs/requirements.txt

      # Regenerate the Autodoc page (docs/api/index.md) from the header comments:
      # doxygen -> XML -> moxygen -> Markdown. Keeps the committed page in sync.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      # Non-interactive + a bounded lock wait so a debconf prompt or a background
      # apt-daily lock can't hang the step indefinitely (it hung for hours once).
      - name: Install doxygen
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=120 doxygen
      - name: Generate autodoc
        run: bash docs/gen-api.sh

      - name: Build site
        run: zensical build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
