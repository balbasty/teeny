name: MSVC scratch repro (#268)

# Manual-only, single-file compiles for iterating on the #268 MSVC operator()
# overload-resolution defect, without paying for the full CMake/CTest build
# (test-cmake-matrix.yaml) or the macOS leg of that matrix. Never runs on
# push/PR -- workflow_dispatch only. Scratch: delete scratch_msvc268/ and this
# workflow once the #268 investigation is done, win or lose.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
  # workflow_dispatch alone can't be invoked via API until this file exists on
  # the default branch -- push-trigger scoped to this one scratch branch so it
  # runs immediately on this throwaway branch without touching main.
  push:
    branches:
      - claude/msvc-268-scratch

permissions:
  contents: read

jobs:
  repro:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      # Same rewrite as test-cmake-matrix.yaml: the CCCL submodule is pinned via
      # SSH in .gitmodules, so point it at HTTPS for an unauthenticated runner.
      - name: Fetch CCCL submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile order_a.cpp
        continue-on-error: true
        run: cl /std:c++17 /EHsc /nologo /I include /I external\cccl\libcudacxx\include /Fe:order_a.exe scratch_msvc268\order_a.cpp

      - name: Compile order_b.cpp
        continue-on-error: true
        run: cl /std:c++17 /EHsc /nologo /I include /I external\cccl\libcudacxx\include /Fe:order_b.exe scratch_msvc268\order_b.cpp

      - name: Compile isolated.cpp
        continue-on-error: true
        run: cl /std:c++17 /EHsc /nologo /I include /I external\cccl\libcudacxx\include /Fe:isolated.exe scratch_msvc268\isolated.cpp

      - name: Compile preceded.cpp
        continue-on-error: true
        run: cl /std:c++17 /EHsc /nologo /I include /I external\cccl\libcudacxx\include /Fe:preceded.exe scratch_msvc268\preceded.cpp

      # No CCCL/mdspan at all -- just the same enable_if_t-partitioned operator()
      # overload-set SHAPE, to isolate whether the defect is in that general
      # pattern or specific to teeny's mdspan-based tensor.
      - name: Compile bare_repro.cpp (no CCCL/mdspan)
        continue-on-error: true
        run: cl /std:c++17 /EHsc /nologo /Fe:bare_repro.exe scratch_msvc268\bare_repro.cpp && .\bare_repro.exe

      # FIX ATTEMPT A: same overload-set shape, but the enable_if fold-expression
      # moves into a named trait instead of sitting inline in enable_if_t<...>.
      - name: Compile fix_a_named_trait.cpp
        continue-on-error: true
        run: cl /std:c++17 /EHsc /nologo /Fe:fix_a.exe scratch_msvc268\fix_a_named_trait.cpp && .\fix_a.exe

      # FIX ATTEMPT B: no enable_if-partitioned overload set at all -- one
      # operator() template per const-qualification, if-constexpr dispatch
      # inside. This is the issue's originally suggested remedy.
      - name: Compile fix_b_if_constexpr.cpp
        continue-on-error: true
        run: cl /std:c++17 /EHsc /nologo /Fe:fix_b.exe scratch_msvc268\fix_b_if_constexpr.cpp && .\fix_b.exe
